[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hose-quant-system"
version = "0.1.0"
description = "Phase 0 bootstrap and vnstock data-capability audit for HOSE equities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "packaging>=24,<27",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "tenacity>=8.2,<10",
  "vnstock>=4.0,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
hose-quant = "hose_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
packages = ["hose_quant"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "live: requires network access and a real provider credential",
]
